description: |
  Control your [Home Assistant](https://www.home-assistant.io) home with the TV remote.

  Choose which of your Home Assistant devices to show, and each one becomes a card on a grid with
  pages: press OK to switch it on or off, or hold OK for all its controls.

  ## Features
  - Lights (brightness and colour), switches and plugs, buttons, scenes and scripts
  - Heating, media players (such as Sonos), blinds and other safe covers, fans and robot vacuums
  - Cameras as refreshing still pictures, and sensors
  - Rooms and names come straight from Home Assistant
  - Reorganise the layout: move cards and add pages

  ## Private and safe
  - The TV talks straight to your own Home Assistant on your home network. There is no other server.
  - Sign in with a Home Assistant username and password; the password is never stored.
  - Locks, alarms, doors, garage doors and gates are deliberately not shown.
  - An optional PIN lock keeps guests and children out. Turn it on if any of your switches,
    buttons, scripts or scenes controls something sensitive.

  Works on webOS 4.0 and newer, and does not need root. Tested on an LG C9 (webOS 4.5).

  ## Source and help
  https://github.com/JayTee-2024/home-assistant-lg
