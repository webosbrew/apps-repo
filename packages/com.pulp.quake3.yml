description: |
  **Includes the Quake III Arena demo**, so it plays right after installing.

  [ioquake3](https://ioquake3.org), the Quake III Arena engine, as a native webOS app. For the full game,
  copy your own `baseq3` folder (`pak0.pk3` from the CD, Steam or GOG, plus the 1.32 point release's
  `pak1.pk3` to `pak8.pk3`) to a USB drive as `quake3/baseq3/`. The game finds it on any USB drive and
  keeps its config, saves and screenshots in `quake3/home/` next to it.

  * Plays with the remote (arrows walk and turn, OK shoots, Back opens the menu), a game controller,
    or a USB keyboard and mouse
  * The OpenGL2 renderer on OpenGL ES 3 at 1080p, with vsync and a 60 fps cap
  * Mutes and drops to 10 fps while another app is in front, such as after pressing Home
  * No root needed

  ## Requirements

  * An ARMv8 CPU, as in TVs with a 64-bit kernel such as the LG C1 (tested on webOS 6.5.3)
  * OpenGL ES 3

  Unofficial port, not affiliated with id Software. The demo data is id Software's, distributed under
  its own license (`Q3A_EULA.txt`, installed with it).
  Source: [pulpoff/webos-ioquake3](https://github.com/pulpoff/webos-ioquake3)
