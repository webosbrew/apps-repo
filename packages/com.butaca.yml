# The webosbrew Homebrew Channel submission for this app.
#
# THIS FILE DOES NOT BELONG TO THIS REPOSITORY AT RUNTIME. It is kept here so the submission is
# version-controlled and reviewable alongside the thing it describes. To submit, fork
# https://github.com/webosbrew/apps-repo and copy this file to `packages/com.butaca.yml`.
#
# Schema: content/schemas/packages/PackageInfo.json in that repo.
# Required: title, iconUri, manifestUrl, category, pool, description. Verified 2026-11-06.
#
# Every claim in the description below is a claim about THIS build, and the ones that matter to an
# owner are the ones the app cannot check for them: which sets play video, which do not, and what
# the app talks to. Keep it in step with the release note and `docs/install-and-verify.md`.

title: Butaca

