description: |
  Transmissionic is a modern, fast, and feature-rich BitTorrent remote management client for Transmission daemons on LG webOS TVs.

  Ported from the open-source project by [6c65726f79/Transmissionic](https://github.com/6c65726f79/Transmissionic).

  ### Features

  * **Full Transmission Control**: View active downloads, progress bars, real-time download and upload speeds, ETA, and peer statistics.
  * **Queue Management**: Pause, resume, reorder, remove, or add new torrent files and magnet links.
  * **Multi-Server Support**: Easily manage multiple Transmission servers with built-in connection profile manager.
  * **webOS 5+ Compatibility**: Transpiled specifically for Chromium 68 compatibility, eliminating ES2020 runtime syntax errors on webOS 5 (OLED CX) and newer models.
  * **TV Remote Friendly**: Supports native webOS Back key (`461`) for modals and drawer dismissal, along with full LG Magic Remote air-mouse navigation.
  * **Dark OLED Theme**: Sleek dark-mode aesthetic built with Ionic Vue.
