description: |
  A file manager and media player for rooted TVs.

  * Browse USB drives, SMB shares (found on the local network, or saved with a login) and SFTP servers
  * Play video, music and photos with the TV's own player, with resume and *Continue watching*
  * Embedded and external subtitles (SRT, ASS, SSA, VTT) and a choice of audio track
  * Thumbnails and stream information, with the optional ffmpeg download
  * List and grid views, sorting, pinned folders, dark and light themes
  * Read-only: it never changes or deletes your files

  ## Requirements

  * **Root and the Homebrew Channel.** On first launch the app installs a boot hook through the
    Homebrew Channel and starts its file service as root. Uninstalling the app removes the hook
    at the next boot.
  * **A 64-bit kernel** (`uname -m` prints `aarch64`), as on the LG C1. Tested on webOS 6.5.3.

  ffmpeg, for thumbnails, stream information and embedded subtitles, is an optional download that
  the app offers on first launch: John Van Sickle's static arm64 build, 19 MB.

  Source, details and the bridge API: [pulpoff/webos-file-manager](https://github.com/pulpoff/webos-file-manager)
