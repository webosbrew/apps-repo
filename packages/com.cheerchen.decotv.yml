title: DecoTV
iconUri: https://raw.githubusercontent.com/CheerChen/decotv-webos/main/assets/icons/icon-large.png
manifestUrl: https://github.com/CheerChen/decotv-webos/releases/latest/download/com.cheerchen.decotv.manifest.json
category: multimedia
pool: main
# ES2020 (optional chaining, nullish coalescing); Chromium 87+ / webOS 7.0+
requirements:
  webosRelease: '>=7.0'
description: |
  Native [DecoTV](https://github.com/Decohererk/DecoTV) client for LG webOS TVs.
  Connects to a self-hosted DecoTV server in public or password auth mode.
  Public mode supports anonymous browsing; password mode enables account sync.
  No built-in media sources — configure sources on the server.

  Features: Douban catalog, source probing and failover, poster caching,
  continue watching, episode and outro playback controls, D-pad navigation,
  and hardware HLS decode.

  Source: https://github.com/CheerChen/decotv-webos (MIT)
