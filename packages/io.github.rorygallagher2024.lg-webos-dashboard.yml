requirements:
  webosRelease: '>=4.4'
description: |
  # Glasshouse

  **Own the glass.** A dashboard for the TV itself, with the remote or from a browser on the home network.

  - Readings: SoC temperature, CPU, memory, storage, uptime, HDMI signal details
  - Game: a game's frame rate and LG's Game Optimizer settings, on TVs that have them
  - Privacy: LG's data consents, each explained and switchable; screen content recognition; LG's on-screen ads and promotions; an ad and telemetry blocker; LG's background data services
  - OLED care: panel hours, pixel refresher, burn-in protections
  - Power: staying on the network while off, Always Ready, Quick Boot, Wake-on-LAN
  - Apps: uninstall, and switch off background services
  - Service menu: opens LG's service menus; unlocking the full menu asks first
  - Home Assistant bridge over MQTT, set up from a phone
  - Requires webOS 4.4 or later. Installed with `deploy.sh` from its repository, the dashboard also runs on webOS 3.4 and 3.9

  Requires root. On first launch the app installs a small server under `/var/lib/tvweb` with a boot hook, and answers only on the TV until setup opens it to the network. Everything it can change on the TV is opt-in and listed in [TV-CHANGES.md](https://github.com/rorygallagher2024/lg-webos-dashboard/blob/main/docs/TV-CHANGES.md). Uninstalling the app removes the server within a few minutes.
