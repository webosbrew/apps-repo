title: Luma Player
iconUri: https://raw.githubusercontent.com/funnymataleao/luma-webos-launcher/main/extras/player/app/icon.png
manifestUrl: https://github.com/funnymataleao/luma-webos-launcher/releases/latest/download/com.denisefremov.luma.player.manifest.json
category: multimedia
pool: main
requirements:
  webosRelease: '>=5.0'
shortDescription: Companion video player for Jellyfin and Plex in Luma
description: |
  Luma Player is a companion webOS application that plays video from Jellyfin
  and Plex media libraries opened through the Luma launcher.
  Install this application together with Luma for playback on your LG television.
  Source code was developed with Claude Code and OpenAI Codex under human
  review and is part of the Luma open source project tested on an LG OLED C1.

  **Requires the Luma launcher to select content.**
