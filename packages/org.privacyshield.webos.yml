description: |
  See your TV model, software, Live Plus, and voice status. Change settings
  exposed by the TV, verify each change, and save settings to restore later.
  Review LG agreement choices and their documented effects. Dark mode is the
  default; your light-theme choice is saved on the TV.

  LGPrivacyShield runs locally through webOS settings services and sends no
  app data during normal use. We expect it to support all 18 LG OLED families:
  B1–B6, C1–C6, and G1–G6. For every family, the expected webOS versions are
  6.x, 22, 23, 24, 25, and 26, including versions newer than the TV's launch
  year. Controls vary by model, region, firmware, and Homebrew access, and
  appear only when the TV returns a recognized value. Physical TV testing has
  been on one C6 running webOS 26 (Rockhopper 11.2.0-3512, firmware 43.21.79).

  If a model is missing or a control cannot be read, choose Prepare
  compatibility report in Controls and scan the QR code. It opens a prefilled
  GitHub form; submitting it creates a public issue for maintainers to review.
  The report includes model, software and firmware, profile, service access,
  and whether each control could be read. It excludes current setting values
  and agreement choices. Owners can add the TV region or a menu-path note.
  These reports let us compare which controls are readable across models,
  software versions, and regions, spot coverage gaps, and improve the maps.
  Support development on [Ko-fi](https://ko-fi.com/snapetech).
