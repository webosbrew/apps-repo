description: |
  See your TV model, software, Live Plus, and voice status. Change settings
  exposed by the TV, verify each change, and save settings to restore later.
  Review LG agreement choices and their documented effects. Dark mode is the
  default; your light-theme choice is saved on the TV.

  LGPrivacyShield runs locally through webOS settings services and sends no
  app data during normal use. To report an unsupported TV, scan the single QR
  code with a phone. The link opens a prefilled GitHub form with model,
  software, service access, and control readability; it excludes setting
  values and agreement choices. Submitting the form creates a public issue so
  maintainers can investigate support for that TV.

  Expected to work on webOS 6 and later. Physical testing is on a C6 running
  webOS 26 (Rockhopper release 11.2.0-3512, firmware 43.21.79); earlier
  releases are untested. Controls depend on your model and Homebrew access.
  Support development on [Ko-fi](https://ko-fi.com/snapetech).
