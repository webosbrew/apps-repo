# Web Mario 64: https://github.com/pustal/Web-Mario-64
# The file name (without .yml) is the app id, as in appinfo.json.

# Display name of the application
title: Web Mario 64
# Publicly accessible HTTPS link to the icon image itself (not a github.com/.../blob/ page)
iconUri: https://raw.githubusercontent.com/pustal/Web-Mario-64/main/webos/largeIcon.png
# The manifest of the latest release (written by the webos-package build target)
manifestUrl: https://github.com/pustal/Web-Mario-64/releases/latest/download/org.webmario64.app.manifest.json
category: game
# Open source (GPL-3.0; built on Ghostship, MIT)
pool: main
# Native app rendering with OpenGL ES 3 (32-bit ARM). Developed for webOS 6;
# older TVs are untested.
requirements:
  webosRelease: '>=6.0'
description: |
  Super Mario 64 for webOS, built from Ghostship, HarbourMasters' PC port of
  the Super Mario 64 decompilation, as a native app.

  **You need your own Super Mario 64 ROM** (USA or Japan; .z64, .n64 or
  .v64). The app contains no game data. On first launch the TV shows an
  address and a PIN: open it on a phone or computer on the same network and
  upload the ROM. The TV turns it into the game's archive by itself. Or put
  the ROM on a USB drive, in a folder named "Super Mario 64" or in a
  RetroArch-style roms/n64 folder, and plug it in.

  - Plays with a game controller or the TV remote; Back opens the app's menu
    (the game pauses), with Ghostship's own settings menu one step away
  - The same web page keeps working while you play: saves, mods (.o2r/.otr)
    and the logs
  - The game files (ROM and archive) and mods can stay on a USB drive, and
    move between the TV and a drive from the page

  A non-commercial fan project, not affiliated with or endorsed by Nintendo
  or HarbourMasters.
# Screenshots shown above the description
screenshots:
  - url: https://raw.githubusercontent.com/pustal/Web-Mario-64/main/docs/images/web-page.png
    caption: Transfer page
  - url: https://raw.githubusercontent.com/pustal/Web-Mario-64/main/docs/images/setup-screen.png
    caption: Setup screen on the TV
