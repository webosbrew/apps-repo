title: WireGuard VPN
iconUri: https://raw.githubusercontent.com/RodriguezCF/webos-wireguard/main/app/com.github.cfernande1470.wireguard/icon.png
manifestUrl: https://github.com/RodriguezCF/webos-wireguard/releases/latest/download/com.github.cfernande1470.wireguard.manifest.json
category: utility
pool: main
requirements:
  webosRelease: '>=5.0'
description: |
  WireGuard VPN client for rooted LG webOS TVs using Homebrew Channel.

  The app runs WireGuard in userspace through `wireguard-go`, because LG webOS stock kernels usually do not include
  the WireGuard kernel module.

  Features:

  - Bundled 32-bit ARMv7 `wg`, `wireguard-go`, and configuration upload server, compatible with supported 32-bit and
    64-bit LG TVs
  - English and Spanish TV interface
  - Time-limited `wg0.conf` upload using a random access code, failed-attempt lockout, and automatic shutdown after a
    successful upload
  - Start, stop, status, routes, configuration, and logs from the TV UI
  - Local network traffic stays off the tunnel while the VPN is up
  - IPv6 leak protection: IPv6 is disabled on the LAN interface while the tunnel is active and restored on stop
  - Optional start on boot
  - Runtime uninstall support

  Requirements:

  - Rooted LG webOS TV running webOS 5.0 or later
  - Homebrew Channel root service
  - `/dev/net/tun` support

  Notes:

  - DNS handling is not currently implemented.
  - IPv6 routes from the WireGuard configuration are not applied yet; leak prevention is.
  - This app is intended for trusted personal VPN configurations.

  Source: https://github.com/RodriguezCF/webos-wireguard (MIT)
funding:
