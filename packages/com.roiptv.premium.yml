description: |
  ROIPTV Premium is a video player for LG televisions running webOS 3.0 or later.
  Users can connect with their ROIPTV subscriber account or load a playlist they provide
  through the phone activation page. The app contains no channels, playlists or video streams.

  Users must provide playlists and subscriptions they are authorized to use. Playback relies
  on the television's built-in media support; available formats vary by model, firmware and
  content provider. The activation page asks for the TV's MAC address from network settings
  because webOS does not expose it to apps.

  This proprietary application is submitted to the non-free pool. The submitter confirms they
  hold the rights needed to distribute this adaptation. No source code is offered under an
  open-source license.

