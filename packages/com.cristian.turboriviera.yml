category: game
pool: main
description: |
  An original 90s-style arcade road racer for LG webOS TVs: a red convertible,
  a pseudo-3D road with curves and hills, traffic, a countdown timer and forks
  that let you choose your route through 15 stages. Name, graphics and music are
  original (no Sega assets). Road signs and billboards show towns, provinces and
  local businesses of the Fermo area (Marche, Italy).

  ## Controls

  | Key | Action |
  | --- | --- |
  | ◀ ▶ | steer |
  | ▼ | brake |
  | ▲ / OK | throttle (manual mode only; auto-throttle is the default) |
  | Red | change radio station |
  | Green | audio on/off |
  | Yellow | auto / manual throttle |
  | Back | pause |

  Source code: https://github.com/famcellini/Turbo-Riviera (MIT license)
