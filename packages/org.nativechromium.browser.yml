category: internet
pool: main
shortDescription: Chromium 151 with the full Chrome interface, made for the TV
description: |
  A desktop Chromium 151 built for the TV and running as an ordinary webOS app: tabs, the address bar, bookmarks,
  history, downloads, settings, and extensions from the Chrome Web Store. No root needed.

  - Pages are drawn on the TV's GPU, and video on any site goes to the TV's hardware decoder (up to 1080p60).
  - A sharp 1920x1080 window with the interface at 1.5x.
  - The remote's arrows, OK and Back work everywhere, the Magic Remote pointer works as a mouse, and typing uses
    LG's on-screen keyboard.
  - TV Tools, built in: a video quality limit for any site, TV versions of websites, lite mode, and a tab limit.
  - Bookmarks and settings are kept on the TV and survive reboots.

  Runs on webOS 4.4 (2018-2019 models) and newer. No Netflix or other DRM video, and no Google account sync.

  Source, supported TVs and bug reports: [github.com/sarahahzub/WebOS-Chromium](https://github.com/sarahahzub/WebOS-Chromium)
requirements:
  webosRelease: '>=4.4'
