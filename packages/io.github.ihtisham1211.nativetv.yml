description: |
  # Native Tv

  A server that runs on a rooted LG webOS TV, with a dashboard for any phone or computer, a native app on the TV, and an MQTT bridge for Home Assistant.

  - See and switch off what LG's ACR (Live Plus), ad tracking and data agreements collect.
  - Block LG's ad and telemetry servers (a hosts-file block, off until switched on).
  - Debloat apps and background services, remap the remote's buttons, and protect an OLED panel from burn-in.
  - Read the TV's hardware telemetry and control it from Home Assistant, over a broker on the home network.

  **What it changes on the TV** is listed in the [documentation](https://ihtisham1211.github.io/native-tv/administration/tv-changes/). The TV must be rooted and have the Homebrew Channel. The first launch of the app sets the server up and starts the setup wizard.

  **Tested on** one TV, an LG OLED65B3PUA (webOS 10.3.2). Other models and webOS versions are untried with this server; webOS 4 and later are supported by design and a [TV report](https://github.com/ihtisham1211/native-tv/issues/new?template=tv_report.md) adds a model to the table.

  Native Tv grew out of [Glasshouse](https://github.com/rorygallagher2024/glasshouse) by Rory Gallagher (MIT). The server is a C++ daemon with no Node on the TV, and the TV app is native.

  Source, docs and issues: [ihtisham1211/native-tv](https://github.com/ihtisham1211/native-tv).
