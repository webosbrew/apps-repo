description: |
  A port of the Cooliris 3D photo wall from Android 2.3 to the TV. It browses
  the photos on a USB drive as a wall of album stacks, with a grid, a
  timeline and a full screen view for each album. Use the remote's pointer or
  its arrow keys.

  Photos in the screenshots are from [Pixabay](https://pixabay.com/).

