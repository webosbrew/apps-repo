# SonicWebMania: https://github.com/pustal/SonicWebMania
# The file name (without .yml) is the app id, as in appinfo.json.

# Display name of the application
title: SonicWebMania
# Publicly accessible HTTPS link to the icon image itself (not a github.com/.../blob/ page)
iconUri: https://raw.githubusercontent.com/pustal/SonicWebMania/main/webos/largeIcon.png
# The manifest of the latest release (written by the webos-package build target)
manifestUrl: https://github.com/pustal/SonicWebMania/releases/latest/download/org.sonicwebmania.app.manifest.json
category: game
# Source available under the RSDKv5 / Sonic Mania decompilation licences (non-commercial)
pool: main
# Native SDL2 app with its own SDL-webOS build. Developed and tested on webOS 6;
# older releases are untested.
requirements:
  webosRelease: '>=4.0'
description: |
  Sonic Mania on your LG TV: the RSDKv5 and Sonic Mania decompilations by
  Rubberduckycooly and chuliRMG, built as a native webOS app.

  **You need your own copy of the game.** The app contains no game data. On
  first launch the TV shows an address and a PIN: open it on a phone or
  computer on the same network and upload the `Data.rsdk` from your copy of
  Sonic Mania (for example the Steam version).

  - Plays with game controllers, or with the remote held sideways: 2/8/6/4 as
    the D-pad, the colour buttons as A/B/X/Y (Xbox colours), 0 as Start
  - Back opens a menu at any time: Resume, Achievements, Button test,
    Restart game, Close app
  - All 18 achievements unlock as you play; the menu lists unlocked and
    locked ones with how to get each
  - Download and upload your saves from the same web page
  - Light on storage: about 4.5 MB installed plus your Data.rsdk; free space
    is checked before anything is written
  - Mania Plus content is off by default and can be enabled on the web page
    if you own it

  A non-commercial fan project, not affiliated with or endorsed by SEGA.
# Screenshots shown above the description
screenshots:
  - url: https://raw.githubusercontent.com/pustal/SonicWebMania/main/docs/images/setup-screen.png
    caption: First launch
  - url: https://raw.githubusercontent.com/pustal/SonicWebMania/main/docs/images/menu.png
    caption: Back menu
  - url: https://raw.githubusercontent.com/pustal/SonicWebMania/main/docs/images/achievements.png
    caption: Achievements
  - url: https://raw.githubusercontent.com/pustal/SonicWebMania/main/docs/images/web-page.png
    caption: Transfer page
