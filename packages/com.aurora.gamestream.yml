description: |
  **Aurora** is a fork of [Moonlight TV](https://github.com/mariotaku/moonlight-tv) for LG webOS,
  focused on 4K 120 Hz HDR streaming with Sunshine or GameStream hosts.

  App ID: `com.aurora.gamestream` (separate from Moonlight `com.limelight.webos`).

  * HEVC, AV1, and HDR10 when the host and the TV support them
  * Up to 4K 120 Hz
  * Releases: [github.com/GuiDev1994/aurora-tv/releases](https://github.com/GuiDev1994/aurora-tv/releases)
