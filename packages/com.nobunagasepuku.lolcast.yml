shortDescription: Cast video and music to your TV
requirements:
  webosRelease: '>=5.0'
description: |
  Cast video and music to your TV. some webOS versions have no Cast receiver of its own, so Lolcast is one. While the app is open, your TV appears in VLC under **Playback > Renderer** as **LG TV (Lolcast Ultra)**. Heavily tested with VLC's cast renderer but should work with platforms/software too. Feedback welcome in our repo.

  - **Plays wide variety of codecs.** H.264, HEVC and VP9 go straight to the TV's hardware decoders, including 4K. VLC converts anything the TV can't decode on your computer first.
  - **Controls work from both ends.** VLC's pause button and position slider work while casting. On the remote, OK pauses and Back stops casting.

  ### Things to know

  - Developed and tested mainly on a rooted LG OLED CX (2020) on webOS 5.3, casting from VLC. 
  - **The app has to be open.** It can't receive anything once it's closed. Further work on background casting will be implemented
  - Chrome, Google Home and the YouTube may not work, because they check for a certificate signed by Google.
  - Subtitles for videos dont work at the moment, further work may enable this.

  The source code, the full list of formats and the other limits are on [Codeberg](https://codeberg.org/nobunaga/LoLCast).
  Feedback and bug reports welcome.
