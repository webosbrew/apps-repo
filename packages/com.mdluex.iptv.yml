title: Mdluex IPTV
iconUri: https://mdluex.github.io/mdluex-iptv/lg/icon.png
manifestUrl: https://github.com/mdluex/mdluex-iptv/releases/latest/download/com.mdluex.iptv.manifest.json
category: multimedia
pool: non-free
# Written for Chromium 76+ (verified on Samsung Tizen 6.0); webOS 6.0 ships Chromium 79
screenshots:
  - url: https://mdluex.github.io/mdluex-iptv/screens/home.png
    caption: Home: featured video, your channel and new movies
  - url: https://mdluex.github.io/mdluex-iptv/screens/movies.png
    caption: Movies by category, with counts
  - url: https://mdluex.github.io/mdluex-iptv/screens/movie-details.png
    caption: Movie details with Play and My List
  - url: https://mdluex.github.io/mdluex-iptv/screens/series-details.png
    caption: Series with seasons and episodes
  - url: https://mdluex.github.io/mdluex-iptv/screens/live-tv.png
    caption: Live TV with channel list and TV guide
  - url: https://mdluex.github.io/mdluex-iptv/screens/youtube-channel.png
    caption: The Mdluex Industries YouTube channel
requirements:
  webosRelease: '>=6.0'
description: |
  Netflix-style IPTV player for your own Xtream Codes account: live TV with channel
  switching and TV guide, movies and series with resume, favorites, search and
  parental lock. Also plays the Mdluex Industries YouTube channel (the author's own).
  No built-in playlists or channels: you sign in with the IPTV subscription you have.

  The same app also runs on Samsung (Tizen) and Android TV.

  Source: https://github.com/mdluex/mdluex-iptv (personal-use license; the README
  grants this repository permission to redistribute the official releases)
