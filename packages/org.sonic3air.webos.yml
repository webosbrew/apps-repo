# Sonic 3 A.I.R. for webOS: https://github.com/pustal/Sonic-3-A.I.R.-Knuckles-Web
# The file name (without .yml) is the app id, as in appinfo.json.

# Display name of the application
title: Sonic 3 A.I.R.
# Publicly accessible HTTPS link to the icon image itself (not a github.com/.../blob/ page)
iconUri: https://raw.githubusercontent.com/pustal/Sonic-3-A.I.R.-Knuckles-Web/main/webos/largeIcon.png
# The manifest of the latest release (written by the webos-package build target)
manifestUrl: https://github.com/pustal/Sonic-3-A.I.R.-Knuckles-Web/releases/latest/download/org.sonic3air.webos.manifest.json
category: game
# Open source (GPL-3.0, like Sonic 3 A.I.R. itself)
pool: main
# Native app rendering with OpenGL ES 2 (32-bit ARM). Developed and tested on
# webOS 6; older TVs are untested.
requirements:
  webosRelease: '>=6.0'
description: |
  Sonic 3 - Angel Island Revisited, Eukaryot's open source remaster of
  Sonic 3 & Knuckles, built as a native webOS app.

  **You need your own Sonic 3 & Knuckles ROM.** The app contains no game
  data. On first launch the TV shows an address and a PIN: open it on a phone
  or computer on the same network and upload the ROM (.bin, .md or .gen).
  Or put it on a USB drive, in a folder named "Sonic 3 AIR" or in a
  RetroArch-style roms/megadrive (or roms/genesis) folder, and plug it in.

  - Plays with a game controller or the TV remote, held sideways like a pad;
    Back opens the app's menu (the game pauses)
  - The same web page keeps working while you play: saves, settings, mods
    and the optional remastered soundtrack (from your own copy of A.I.R.)
  - Mods can also stay on a USB drive
  - The game's "Check for updates" looks for new releases of this app

  A non-commercial fan project, not affiliated with or endorsed by SEGA.
# Screenshots shown above the description
screenshots:
  - url: https://raw.githubusercontent.com/pustal/Sonic-3-A.I.R.-Knuckles-Web/main/docs/images/web-page.png
    caption: Transfer page
  - url: https://raw.githubusercontent.com/pustal/Sonic-3-A.I.R.-Knuckles-Web/main/docs/images/setup-screen.png
    caption: Setup screen on the TV
  - url: https://raw.githubusercontent.com/pustal/Sonic-3-A.I.R.-Knuckles-Web/main/docs/images/menu.png
    caption: The app's menu
