shortDescription: Open-source M3U player with EPG, catch-up playback and remote-friendly controls.
description: |
  A remote-friendly, open-source M3U media player for LG webOS TVs.


  Features include multiple playlist management, XMLTV and DIYP EPG,
  catch-up playback when supported by the user's provider, favorites,
  channel number entry, playback diagnostics and player tuning controls.


  This application does not include, provide or automatically fetch any
  channels, programmes, playlists or EPG data. Users must provide their own
  legally obtained M3U and EPG services.


  Free and open source under the MIT license.
  Source code: https://github.com/HCLGitHub/qoder-iptv
