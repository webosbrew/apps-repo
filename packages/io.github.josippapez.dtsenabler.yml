description: |
  ## DTS Enabler — DTS + Dolby TrueHD/MLP audio for webOS 25

  Restores **DTS** and **Dolby TrueHD / MLP** audio playback on rooted **LG
  webOS 25** TVs (C5-class, chassis o22n3), where LG ships no DTS or TrueHD
  decoder. Audio is decoded to native **discrete 5.1** PCM — there is no stereo
  downmix in the pipeline.

  ### Features
  - DTS and DTS-HD (core) playback, including DTS in **MKV, MP4, TS and M2TS** containers
  - Dolby **TrueHD / MLP** playback (MKV)
  - Decoded to native discrete **5.1** PCM into LG's audio sink — no stereo downmix anywhere in the
    GStreamer path. What leaves the TV is then LG's own output stage: the built-in speakers are
    downmixed by the TV as usual, and what reaches an AVR over HDMI eARC depends on the TV's
    *Digital Sound Output* setting. (Optical/S-PDIF carries two channels of PCM, so multichannel
    over optical is not a thing this — or any — decode-to-PCM path can deliver.)
  - **Reversible, with one stated exception** — the codec/demuxer/config overrides are
    bind-mounts over the stock files, so Disable/Uninstall (or a reboot) revert them. The one
    persistent write is the GStreamer plugin registry, a `cp -f`; Disable/Uninstall revert it by
    regenerating a clean stock registry from the pristine on-disk plugins. If a bind is busy
    because a live process has it mapped, the fallback is a lazy detach and a reboot clears it.
  - **Applies only to verified TVs** — before binding anything, the installer and the boot hook
    fingerprint the stock plugins they would shadow and compare them against a table of verified
    sets. An unrecognised set is **refused** with the probed values shown for reporting, and can
    only be overridden by an explicit two-step "Try anyway (experimental)" opt-in, which itself
    requires the payload's dynamic dependencies to resolve on that TV.
  - **Fail-safe boot hook** — re-applies automatically on reboot, and stands itself down if a
    firmware update changes the GStreamer version or the stock plugins it was verified against, so
    normal playback is never affected. It also self-heals: if the app is removed while still
    enabled, the next boot drops the binds, regenerates the stock registry and unlinks the hook.
  - Built-in self-test and a play-by-ear check.

  ### Requirements
  - A **rooted** LG **webOS 25** TV with the Homebrew Channel (uses its root exec service)
  - webOS 10 or newer

  ### Notes
  - Decode-to-PCM only; DTS/TrueHD **bitstream passthrough** is out of scope.
  - DTS-HD MA decodes its lossy core (no XLL lossless extension).
  - While enabled, gst-libav's software decoders come from our ffmpeg 4.4 build rather than LG's
    ffmpeg 5 build, because the TrueHD-capable `libgstlibav.so` replaces LG's.
  - Open source, mixed licenses: the app, the demuxers and the libav/ffmpeg payload are
    LGPL-2.1-or-later; the DTS decoder links libdca and is GPL-2.0-or-later. Build scripts and
    patched sources are in the project repo, which is the corresponding-source offer.

  Source and documentation: https://github.com/josippapez/dts_restore_plus
