requirements:
  # The launcher uses async/await (ES2017). Chromium 53, which webOS 4.x ships, only reaches
  # ES2016, so 4.x cannot run it - the repository's own compatibility check establishes 5.3 as
  # the oldest release this package works on.
  webosRelease: ">=5.3"
