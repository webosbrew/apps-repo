title: myTV
iconUri: https://raw.githubusercontent.com/ViieeS/mytvlauncher/main/package/icon160.png
detailIconUri: https://raw.githubusercontent.com/ViieeS/mytvlauncher/main/package/icon320.png
manifestUrl: https://github.com/ViieeS/mytvlauncher/releases/latest/download/com.viiees.mytvlauncher.manifest.json
category: launcher
pool: main
shortDescription: "Make your TV truly yours: a fast, native home screen for LG webOS"
screenshots:
  - url: https://raw.githubusercontent.com/ViieeS/mytvlauncher/main/docs/screenshots/home.jpg
    caption: Home screen
  - url: https://raw.githubusercontent.com/ViieeS/mytvlauncher/main/docs/screenshots/control-center.jpg
    caption: Control Center
  - url: https://raw.githubusercontent.com/ViieeS/mytvlauncher/main/docs/screenshots/settings.jpg
    caption: Settings
  - url: https://raw.githubusercontent.com/ViieeS/mytvlauncher/main/docs/screenshots/wallpapers.jpg
