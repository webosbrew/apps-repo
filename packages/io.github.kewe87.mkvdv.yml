description: |
  > MKV files play in real Dolby Vision instead of HDR10, by patching the webOS system player's GStreamer matroska demuxer.

  LG's webOS plays Dolby Vision from MP4 and TS, but on webOS 22 the MKV demuxer of its system player
  (GStreamer plugin `libgstmatroska.so`) ignores the Dolby Vision configuration in MKV files, so every
  app falls back to HDR10. LG fixed this only in webOS 25.

  This app puts an improved demuxer over LG's original at startup - built from **LG's own source** with
  LG's Dolby Vision detection from webOS 25. It works in every app that uses LG's media pipeline: Emby,
  Plex, the LG media player, USB and DLNA. **Your MKV files are not changed.**

  ## Features

  - Switch on/off, status, logs, compatibility check, remove everything (English/German)
  - Optional **profile 7 -> 8.1** conversion for UHD Blu-ray remuxes (enhancement layer dropped,
    RPU rewritten with libdovi like `dovi_tool -m 2`)
  - **Autostart is optional** ("Load automatically at boot"): by default the patch lives in RAM and is
    gone after a reboot; autostart re-applies it at each cold boot where the Homebrew Channel boot hook
    exists (firmware-dependent)
  - Root check on every start; without root all actions are locked

  ## Safety

  - **RAM only:** a bind mount over the system file. Nothing is written to firmware partitions; switch
    off or reboot and LG's original is back.
  - The plugin is chosen by GStreamer version and load-checked in an isolated instance before overlaying;
    unknown or unusual files keep LG's behaviour and the demuxer never posts an error.
  - The patch is copied to `/media/developer/mkvdv/`; with autostart enabled it stays active when the app
    is uninstalled. Press **Remove everything** first to remove it completely.

  ## Status

  **Beta.** Requires a **rooted** TV with **webOS 22** (GStreamer 1.18.2). Verified on an LG 86QNED916QE
  (firmware 04.60.91): profile 8.1 plays with the Dolby Vision logo. Profile 7 -> 8.1 is verified with
  test data, not yet with a real UHD Blu-ray remux. Reports from other webOS 22 models are welcome:
  [issues](https://github.com/kewe87/webos-mkv-dolbyvision/issues).

  **Use at your own risk.** Unofficial community project, not affiliated with or endorsed by LG or Dolby.
  Dolby Vision is a trademark of Dolby Laboratories.
