# Submission file for the webOS Homebrew app repository.
#
# Copy this into packages/com.razagr.stremio.yml in a fork of
# https://github.com/webosbrew/apps-repo and open a pull request.
#
# manifestUrl points at releases/latest/download/, so once this is merged the
# channel picks up every future release automatically and this file never needs
# touching again.

# Display name of the application
title: Stremio

# Publicly accessible HTTP/HTTPS URL to the listing icon
iconUri: https://raw.githubusercontent.com/RazaGR/stremio-lg-tv/main/assets/icon160.png

# Publicly accessible manifest, regenerated by CI on every release
manifestUrl: https://github.com/RazaGR/stremio-lg-tv/releases/latest/download/com.razagr.stremio.manifest.json

category: multimedia

# Open source, so the main pool
pool: main

requirements:
  # Stremio's engine is WebAssembly, which arrived in Chromium 57. webOS 3.x
  # (Chromium 38) and 4.x (Chromium 53) cannot run it.
  webosRelease: '>=5.0'

description: |
  # Stremio

  Opens the official Stremio TV interface on LG webOS televisions, so Stremio
  can be used with the TV remote instead of casting from a phone or PC.

  ## Features

  - Boots straight into the remote-friendly Stremio TV layout
  - Signs in once and stays signed in — your account, library and addon
    collection persist across restarts
  - Reports a network problem plainly instead of leaving a black screen, and
    still opens Stremio if the check is inconclusive
  - Detects TVs too old to run Stremio's engine and says so, rather than
    hanging on a page that can never load

  ## Requirements

  webOS 5.0 or newer (2020 models and later). Older sets cannot run Stremio's
  WebAssembly engine.

  ## Notes

  This is a launcher. It contains no media, no addons and no Stremio code — it
  opens Stremio's own official web interface, and everything after that is
  Stremio's software governed by Stremio's terms. Addons are configured in your
  Stremio account, not in this app.

  ## Source

  https://github.com/RazaGR/stremio-lg-tv

  ## Development disclosure

  This application was written with substantial AI assistance (Claude). Design
  decisions, on-device testing on real LG hardware, and review were done by the
  maintainer.
