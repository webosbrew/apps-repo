  "description": "Version 1.5.0 draws Blu-ray (PGS) and styled (ASS) subtitles on the TV instead of having the server re-encode the video, opens HDR titles in HDR, and adds \"Who's watching?\" profiles, trailer previews in rows, Skip intro and subtitle timing.\n\nZorofin brings your Jellyfin movies, shows and Live TV to your LG TV with an app made for the Magic Remote. Continue Watching keeps unfinished titles and the next episode together, and the player has audio, subtitle and quality controls.\n\n### Optional Zorofin server features\n\nWith the free Zorofin plugin and Companion on your server: Home rows, Pick Together for movie night, Live TV with sports scores, Catch Up, Calendar and Requests. Available rows depend on your library and server configuration.\n\nWorks with ordinary Jellyfin servers without the plugin or Companion. You supply your own server and lawful media. No media, channels or subscriptions are included. No root is required.\n\nTested on an LG B5 in the 1.5 QA pass. Other models, Homebrew installation and custom-feed installation have not completed device acceptance.\n\nScreenshot sample-film credits: https://github.com/Zoraz01/zorofin-lg-releases/releases/download/lg-v1.2.0/CREDITS.md. Screenshots are historical 1.2.0 LG sample-library captures, documented in SCREENSHOT_PROVENANCE.json; they are not new 1.5 captures.",
