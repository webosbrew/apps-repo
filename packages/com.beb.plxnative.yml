title: PlxNative

# Both icon URLs are raw links to THIS repository's default branch, so they resolve only once the
# repo is public — and `repogen.lintpkg` rejects a submission whose iconUri does not return 200.
# 160 for the listing card, 320 for the detail page; tools/mkicons.py cuts both from the master.
iconUri: https://raw.githubusercontent.com/GLinnik21/plx-native/main/pkg/icon160.png
detailIconUri: https://raw.githubusercontent.com/GLinnik21/plx-native/main/pkg/icon320.png

# `releases/latest/download/...` always resolves to the newest release, which is how the channel
# picks up an update without this file changing. The release workflow sets neither `draft` nor
# `prerelease` precisely because either would exclude the release from `latest` and break this URL.
manifestUrl: https://github.com/GLinnik21/plx-native/releases/latest/download/com.beb.plxnative.manifest.json

category: multimedia
pool: main

# Max 80 characters (schema-enforced).
shortDescription: A fast, native Plex client for LG webOS TVs — no browser

requirements:
  # Passed VERBATIM to `webosbrew-ipk-verify --fw-releases`, the same tool and flag the release CI
  # runs against the built binary. This bound exists ONLY here — the manifest CI generates carries
  # no version requirement.
  #
  # THE UPPER BOUND IS GONE, and the reasoning is worth keeping. It used to read '>=4.0, <5.0'
  # because the binary genuinely could not START past webOS 4.x: it named libAcbAPI and four
  # FFmpeg SONAMEs in DT_NEEDED, all of which vanish at 5.0, so the loader killed the process
  # before main. That is no longer true — those libraries are resolved at runtime and FFmpeg is
  # bundled, and `tools/fwcompat.py` grades the binary clean on every release from 4.4.2 to
  # 11.2.0 against real firmware inventories.
  #
  # THE CEILING CAME BACK AND WENT AGAIN, 2026-08-09, and the round trip is worth recording.
  # mariotaku's first report from real webOS 6 and 10 hardware read as "crashes or didn't start",
  # which is known-broken and deserves a ceiling. His correction an hour later was the opposite:
  # the app runs, signs in and browses the library there — only playback sticks in buffering. That
  # is an unfinished feature on a working app, not a broken app, and the submission is a DRAFT that
  # cannot land until playback works anyway. Ceiling off.
  #
  # THE FLOOR IS AN INFERENCE, not a measurement, and it should be read as one. webosbrew's
  # firmware database carries exactly ONE image below 4.4.2, so releases 4.0 through 4.3 are graded
  # by nothing. What makes '>=4.0' defensible is webosbrew's own bucketing: their data keys every 
  # release by CODENAME, and 4.0~4.4 are all `goldilocks` with one library set between them
  # (docs/develop/guides/library-version.md). So the claim is "the whole goldilocks bucket looks
  # like the 4.4.2 we graded", which is their model, not ours.
  #
  # AND IT IS SETTLED, 2026-08-11, in the affirmative. The exported-window path that replaces ACB
  # on 5+ has now run on real hardware: mariotaku played six of eight items on an LG 65UP7560AUD
  # (6.5.2) — H.264 1080p and 4K, HEVC, AAC, AC3, an episode, an item watched to the end
  # (github.com/GLinnik21/plx-native/issues/22). His two failures were a server-side defect fixed
  # in v0.3.0 and were firmware-independent. That is ONE firmware, so 5.x, 10 and 11 are still
  # start-verified only and the description says so — but "playback does not start on 5+" is no
  # longer a true sentence and must not be restated. A floor with no ceiling is also how every
  # other package in this repository declares itself.
  webosRelease: '>=4.0'

description: |
  PlxNative is an unofficial Plex client for LG webOS televisions. Its interface is rendered
  directly on the GPU, without Chromium, JavaScript or a WebView, while video is handled by the
  television's hardware decoder.

  <p align="center">
    <strong>
      <a href="https://plxnative.com/">website</a>
      •
      <a href="https://github.com/GLinnik21/plx-native/blob/main/PRIVACY.md">privacy</a>
      •
      <a href="https://github.com/GLinnik21/plx-native/issues">report an issue</a>
    </strong>
  </p>

  ## Screenshots

  ![Home](https://raw.githubusercontent.com/GLinnik21/plx-native/main/docs/screenshots/home.jpg)

  ![Library](https://raw.githubusercontent.com/GLinnik21/plx-native/main/docs/screenshots/library.jpg)

  ![Search](https://raw.githubusercontent.com/GLinnik21/plx-native/main/docs/screenshots/search.jpg)

  ![Player](https://raw.githubusercontent.com/GLinnik21/plx-native/main/docs/screenshots/player.jpg)

  ## Features

  * Sign in with an on-screen QR code and choose a Plex Home profile
  * Browse and play media from your own and shared Plex Media Servers
  * Search across all available servers
  * Direct Play using the television's supported formats, with transcoding when needed
  * 4K, HEVC, Dolby Vision and Dolby Atmos on compatible televisions
  * Resume, seek and scrub, chapters, audio and subtitle tracks, Skip Intro, Skip Credits and
    Up Next

  Features and media compatibility may vary between television models and webOS releases. See
  Project Page for current compatibility information and known limitations.

  ## Privacy

  Crash reports and product analytics are separate, optional choices and remain off unless
  enabled. Use the privacy link above for complete and current information.

  PlxNative is an unofficial, third-party client. It is not affiliated with, endorsed by, or
  sponsored by Plex GmbH, Plex, Inc. or LG Electronics.
