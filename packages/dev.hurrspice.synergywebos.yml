title: SynergyWebOS
iconUri: https://raw.githubusercontent.com/ryanspice/SynergyWebOS/main/app/icon.png
manifestUrl: https://github.com/ryanspice/SynergyWebOS/releases/latest/download/dev.hurrspice.synergywebos.manifest.json
category: utility
