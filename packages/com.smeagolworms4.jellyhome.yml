category: multimedia
pool: main
description: |
  **Root required.** Puts your Jellyfin library on the webOS home screen.

  * **Top carousel** instead of LG ads: continue watching, next up, recently
    added, favorites or a random pick, with artwork composed on the TV
    (poster, backdrop, title logo).
  * **Trailers** from Jellyfin, or from the YouTube links in your metadata,
    preloaded on the TV and played in the carousel (sound when focused).
  * **Rows** on the home screen: continue watching (with progress bar), next up,
    recently added.
  * Optionally **hides LG ads**.
  * Selecting an item opens it in the Jellyfin app.
  * Sign-in with **Quick Connect**, no password to type.

  The home app itself is not modified: a preloaded library rewrites its luna
  replies, and everything is undone on reboot if the patch is disabled. A
  crash-loop guard turns the patch off after three home screen crashes in a
  minute. Tested on webOS 10.3.
