description: |
  PlainHome is a minimal customizable home launcher for rooted LG webOS TVs.

  It lists installed applications in a compact grid, supports custom, LG-order, and
  alphabetical sorting, hide/unhide controls, a resettable custom order, configurable
  focus colors, a clock, localized date, connected named inputs, and optional custom
  header text.

  Root is required for application discovery, icon access, input discovery, and guarded
  removal of applications that webOS marks removable.

  Source: https://github.com/int21asm/plainhome-webos
