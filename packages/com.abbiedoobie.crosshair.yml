shortDescription: Places a configurable crosshair over your TV
description: |
  A crosshair on top of whatever your TV is showing. Pick a shape, color, and size, and the crosshair sits over the picture.

  Made for console and PC games that don't have a crosshair of their own (or only show one while aiming). Game Optimizer, VRR, ALLM, and HDR all stay on with it up, and by default it gets out of the way by itself when you go to Home or open an app.

  ## Features

  - 21 shapes, 11 color presets or any hue you want, and a separate brightness for HDR (the TV draws app graphics a LOT brighter over HDR).
  - Move it anywhere on screen, for games whose aim point isn't dead center.
  - Bind a remote button with [LG Input Hook](https://github.com/Simon34545/lginputhook): one press turns it on or off, and three quick presses open the settings.
  - Comes on with the TV, if you want it to.
  - Changing the look updates the crosshair live.

  Remote button setup and technical details are in the [README](https://github.com/AbbieDoobie/webos-crosshair#readme).
