shortDescription: A native, customizable home screen for LG webOS televisions
description: |
  Luma is a native, remote-first launcher for LG webOS televisions, with a customizable
  home screen, wallpapers, widgets, and quick access to apps, games, and media libraries.
  Connect Jellyfin or Plex, stream PC games via Moonlight, and control Home Assistant devices.
  Install the separate Luma Player package to play Jellyfin and Plex videos.
  Most of the code was written with AI assistants Claude Code and OpenAI Codex under
  human direction, and the application has been tested on a real LG OLED C1 television.

