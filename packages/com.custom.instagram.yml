description: |
  # Instagram for LG webOS TV
  A lightweight, standalone Instagram web client for LG Smart TVs running webOS 3.0+.
  ## Features
  * **Magic Remote Support:** Use pointer and scroll wheel to browse posts and Reels
  * **Full HD 1080p:** Native widescreen layout optimised for TV
  * **No Root Required:** Compatible with both Developer Mode and rooted TVs
