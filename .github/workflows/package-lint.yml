name: 'Package: Lint'

on:
  workflow_call:
    inputs:
      packages:
        type: string
        required: true
      added-packages:
        description: 'Subset of `packages` that this change adds rather than edits.'
        type: string
        required: false
        default: ''

# Disable all permissions
permissions: {}

jobs:
  package-lint:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
      contents: read # Only needed for private repository
      issues: read # Only needed for private repository
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Download Homebrew Toolbox
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 'webosbrew/dev-toolbox-cli'
          latest: true
          # Releases ship both amd64 and arm64 packages. Only take the runner's own architecture.
          fileName: 'webosbrew-toolbox-*_${{ runner.arch == ''ARM64'' && ''arm64'' || ''amd64'' }}.deb'
          out-file-path: 'temp'

      - name: Install dependencies
        run: |
          python3 -m pip install -r ./requirements.txt
          sudo apt-get install ./temp/webosbrew-toolbox-*.deb

      - name: Lint package information
        shell: bash
        env:
          # Lets the licence check use the API's authenticated rate limit instead of
          # the 60/hour shared between everything on the runner's IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export lint_retcode=0

          # Exit code 1 means the submission needs fixing, so fail the check. Anything
          # else means our own tooling could not run: annotate it and leave the PR alone,
          # a re-run will settle it. See repogen/common.py.
          run_check() {
            local what="$1"; shift
            local code=0
            "$@" >> /tmp/lint-report.md || code=$?
            if [ "${code}" -eq 0 ]; then
              return 0
            elif [ "${code}" -eq 1 ]; then
              export lint_retcode=1
            else
              echo "::warning::${what} could not complete (exit ${code})"
            fi
            return "${code}"
          }

          for changed_file in ${{ inputs.packages }}; do
            echo "# Check Results for $(basename "${changed_file}"):" >> /tmp/lint-report.md
            echo >> /tmp/lint-report.md

            echo '## Package Metadata' >> /tmp/lint-report.md
            echo >> /tmp/lint-report.md

            # Rules that would orphan existing installs run only for added packages.
            new_flag=''
            case " ${{ inputs.added-packages }} " in
              *" ${changed_file} "*) new_flag='--new' ;;
            esac

            run_check "lint of ${changed_file}" \
              python3 -m repogen.lintpkg -f "${changed_file}" ${new_flag} || true
            echo >> /tmp/lint-report.md

            ipkfile=/tmp/$(sha256sum "${changed_file}" | cut -d ' ' -f 1).ipk
            run_check "IPK download for ${changed_file}" \
              python3 -m repogen.downloadipk -i "${changed_file}" -o "${ipkfile}" || continue

            echo '## Compatibility Check' >> /tmp/lint-report.md

            run_check "compatibility check for ${changed_file}" \
              python3 -m repogen.check_compat -i "${changed_file}" -p "${ipkfile}" || true
          done
          exit ${lint_retcode}

      - name: Save issue number
        # Skip on act or when previous step cancelled
        if: ${{ !env.ACT && (success() || failure()) }}
        run: echo '${{ github.event.number }}' > /tmp/issue-number.txt

      - name: Upload lint results
        # Skip on act or when previous step cancelled
        if: ${{ !env.ACT && (success() || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: package-lint-results
          path: |
            /tmp/lint-report.md
            /tmp/issue-number.txt

      - name: Print lint results (local)
        # Only run on act when previous steps not cancelled
        if: ${{ env.ACT && (success() || failure()) }}
        run: cat /tmp/lint-report.md
