# Shared job for generating the site and uploading as an artifact.
# Does not deploy to Pages.

name: 'Site: Generate'

on:
  workflow_call:

jobs:
  site-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache package manifests
        uses: actions/cache@v6
        env:
          cache-name: cache-package-manifests
        with:
          path: ./cache
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('packages/*') }}

      # Its own cache so each run restores the newest one and saves its own: the step above never
      # re-saves on a hit.
      - name: Cache GitHub stats
        uses: actions/cache@v6
        with:
          path: ./.stats-cache
          key: stats-${{ github.run_id }}
          restore-keys: stats-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install -r ./requirements.txt

      - name: Generate site content
        run: invoke build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'output'
