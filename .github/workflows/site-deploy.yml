name: 'Site: Deploy'

on:
  push:
    branches:
      - main
  schedule:
    # Every 2 hours: check the manifests, build only if a package changed
    - cron: 17 */2 * * *
    # Daily: build in full whatever changed, which also refreshes download counts of old releases
    - cron: 43 3 * * *
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Stage 1: does any package's manifest differ from what the live site publishes? Compared with
  # the deployed data, not a saved state, so a build or deploy that failed is retried by the next
  # check. Pushes, manual runs and the daily schedule force a full build; the 2-hourly schedule
  # builds only on changes.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      any: ${{ steps.check.outputs.any }}
      force: ${{ steps.check.outputs.force }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install -r ./requirements.txt

      - name: Check manifests
        id: check
        run: |
          python3 -m repogen.check_updates $FORCE_FLAG
          echo "force=${{ github.event.schedule != '17 */2 * * *' }}" >> "$GITHUB_OUTPUT"
        env:
          # Empty for the 2-hourly schedule; every other trigger builds everything.
          FORCE_FLAG: ${{ github.event.schedule != '17 */2 * * *' && '--force' || '' }}

  # Stage 2: the build. If the check job itself failed, pushes, manual runs and the daily
  # schedule still build, in full.
  generate:
    needs: check
    if: >-
      ${{ !cancelled() && (needs.check.outputs.any == 'true'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.event.schedule == '43 3 * * *') }}
    uses: ./.github/workflows/site-generate.yml
    with:
      # JSON ids of the changed packages, so only their repositories' stats are refreshed.
      # Empty (everything) when the build is forced or the check produced nothing.
      stats_only: ${{ needs.check.outputs.force != 'true' && needs.check.outputs.changed || '' }}

  deploy:
    needs: generate
    # Allow one concurrent deployment. Only this job is in the group, so a check run that finds
    # nothing to build does not cancel a deployment in progress.
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
