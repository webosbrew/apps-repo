{# Site-specific presentation for the apps catalog (home shelves, /apps grid,
   featured carousel, app detail header). Kept in this repo so the theme package
   only carries styling common to all webosbrew sites. #}
<style>
    /* Google Play–style tiles: shared by home shelves (horizontal) and /apps grid */
    .app-shelf { display: flex; gap: 1rem; overflow-x: auto; padding-top: .75rem;
        scrollbar-width: none; scroll-snap-type: x proximity; }
    .app-shelf::-webkit-scrollbar { display: none; }
    .app-shelf > * { scroll-snap-align: start; }
    /* Rows are spaced by a margin under each tile rather than by row-gap, cancelled under the
       last row: a closed group panel in the grid then takes no space at all, so hiding it moves
       nothing. A gap would cost a row's spacing even at zero height. */
    .app-grid { display: grid; column-gap: 1rem; margin-bottom: -1rem; justify-items: center;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
    .app-grid > :not(.group-panel) { margin-bottom: 1rem; }
    .shelf-card { flex: 0 0 auto; width: 112px; text-align: center; }
    .shelf-thumb { position: relative; width: 96px; height: 96px; margin: 0 auto .5rem; }
    .shelf-icon { width: 96px; height: 96px; object-fit: cover; background: var(--bs-tertiary-bg); }
    .app-shelf .shelf-thumb > .badge { font-size: .6rem; }
    /* Group tile: the lead's icon on a stack of cards, a "+N" badge for the other members.
       A button that opens the group's panel; reset to look like the link tiles. */
    .group-tile { background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
        border-radius: var(--bs-border-radius-xl); scroll-margin-top: 5rem; }
    .group-tile:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 4px; }
    .group-stack { display: block; isolation: isolate; }
    .group-stack::before, .group-stack::after { content: ""; position: absolute; inset: 0;
        border-radius: var(--bs-border-radius-xl); border: 1px solid var(--bs-border-color);
        transition: transform .2s ease; }
    .group-stack::before { z-index: -1; transform: translateY(-11px) scale(.9);
        background: color-mix(in srgb, var(--bs-body-color) 28%, var(--bs-body-bg)); }
    .group-stack::after { z-index: -2; transform: translateY(-20px) scale(.8);
        background: color-mix(in srgb, var(--bs-body-color) 14%, var(--bs-body-bg)); }
    .group-tile:hover .group-stack::before { transform: translateY(-12px) scale(.9); }
    .group-tile:hover .group-stack::after { transform: translateY(-22px) scale(.8); }
    .group-stack .shelf-icon { position: relative; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
    .group-count { position: absolute; z-index: 1; top: -.55rem; right: -.45rem;
        background: var(--bs-secondary-bg); color: var(--bs-emphasis-color);
        border: 2px solid var(--bs-body-bg); font-size: .75rem; }
    .group-tile[aria-expanded="true"] .shelf-icon { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
    /* Group panel: a recessed surface that opens below the group tile's row, the rows after it
       sliding down. The height animates through a one-row grid, 0fr -> 1fr, which every current
       browser transitions; .group-panel-clip is the row, clipping what is not yet revealed. */
    .group-panel { --notch-x: 50%; --notch-h: 1rem;
        --group-panel-bg: color-mix(in srgb, var(--bs-body-bg) 55%, #000);
        --group-panel-edge: color-mix(in srgb, var(--bs-body-bg) 30%, #000);
        grid-column: 1 / -1; justify-self: stretch; scroll-margin-bottom: 1rem;
        display: grid; grid-template-rows: 0fr;
        transition: grid-template-rows .38s cubic-bezier(.25, .8, .25, 1); }
    .group-panel[hidden] { display: none; }
    .group-panel.is-open { grid-template-rows: 1fr; }
    .group-panel.no-anim { transition: none; }
    @media (prefers-reduced-motion: reduce) { .group-panel { transition: none; } }
    .group-panel-clip { position: relative; min-height: 0; overflow: hidden; }
    /* The recess is drawn as a gradient, darkest at the top and bottom edges, not as an inset
       shadow: the notch is filled with the top-edge colour so the two read as one shape. */
    .group-panel-notch { position: absolute; top: 0; left: var(--notch-x); width: 2.5rem;
        height: calc(var(--notch-h) + 1px); transform: translateX(-50%);
        background: var(--group-panel-edge); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    /* Spacing below the panel is inside the part that animates (the clip), so it grows and
       shrinks with the panel. */
    .group-panel-surface { margin: var(--notch-h) 0 1rem; padding: 1rem 1rem 1.25rem;
        border-radius: var(--bs-border-radius-lg);
        background: linear-gradient(var(--group-panel-edge), var(--group-panel-bg) .9rem,
            var(--group-panel-bg) calc(100% - .9rem), var(--group-panel-edge)); }
    .group-panel-header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1rem; }
    .shelf-wrap ~ .group-panel .group-panel-surface { margin-bottom: .5rem; }
    .shelf-fade, .shelf-fade-start { position: absolute; top: 0; bottom: .5rem; width: 3rem;
        pointer-events: none; transition: opacity .15s ease; }
    .shelf-fade { right: 0; background: linear-gradient(90deg, transparent, var(--bs-body-bg)); }
    .shelf-fade-start { left: 0; opacity: 0;
        background: linear-gradient(90deg, var(--bs-body-bg), transparent); }
    .hero-banner { background:
        radial-gradient(120% 140% at 85% -20%, rgba(207,6,82,.35), transparent 60%),
        linear-gradient(120deg, #1b1420, #141419); }
    /* Featured carousel: all slides share one grid cell, inactive ones invisible rather than
       display:none, so the carousel is always as tall as its tallest slide and never changes
       height as it rotates. Each slide's content is centred vertically in that height. From sm
       up (icon and text side by side) the height comes from the aspect ratio below. */
    #featured-carousel .carousel-inner { display: grid; }
    #featured-carousel .carousel-item { display: block; grid-area: 1 / 1; float: none;
        margin-right: 0; visibility: hidden; }
    #featured-carousel .carousel-item:is(.active, .carousel-item-next, .carousel-item-prev) { visibility: visible; }
    #featured-carousel .carousel-item > .card { height: 100%; }
    @media (min-width: 576px) { #featured-carousel .carousel-item .card { aspect-ratio: 5 / 2; } }
    @media (min-width: 768px) { #featured-carousel .carousel-item .card { aspect-ratio: 3 / 1; } }
    @media (min-width: 992px) { #featured-carousel .carousel-item .card { aspect-ratio: 7 / 2; } }
    @media (min-width: 1200px) { #featured-carousel .carousel-item .card { aspect-ratio: 4 / 1; } }
    #featured-carousel .carousel-item .card-body {
        display: flex; flex-direction: column; justify-content: center; }
    /* Stacked (xs), the text column must not grow down the slide, or it takes the spare height
       and the content sits at the top instead of centred. */
    @media (max-width: 575.98px) { #featured-carousel .carousel-item .row > .col { flex: 0 0 auto; } }
    /* Indicators sit below the banner (outside the card), in a row of fixed height. Each dot is
       a 24px target (transparent border, fill clipped to the 10px dot). The current slide's dot
       is a pill whose fill grows over the interval; the carousel script moves on when that
       animation ends, so the fill is the timer. Paused (data-paused), the fill stops and dims
       and a pause glyph shows on the pill. */
    #featured-carousel { --featured-interval: 6s; }
    #featured-carousel .carousel-controls { display: flex; justify-content: center; align-items: center;
        min-height: 2rem; margin-top: .5rem; }
    #featured-carousel .carousel-indicators { position: static; margin: 0; }
    #featured-carousel .carousel-indicators [data-bs-target] {
        position: relative; box-sizing: content-box; width: 10px; height: 10px; margin: 0; padding: 0;
        border: 7px solid transparent; border-radius: 12px; background-clip: padding-box;
        background-color: rgba(255, 255, 255, .4); opacity: 1; overflow: hidden;
        transition: width .25s ease; }
    #featured-carousel .carousel-indicators .active { width: 32px; background-color: rgba(255, 255, 255, .3); }
    #featured-carousel .dot-fill { position: absolute; inset: 0; background: #fff;
        transform: scaleX(0); transform-origin: left; }
    #featured-carousel .carousel-indicators .active .dot-fill {
        animation: featured-progress var(--featured-interval) linear forwards; }
    #featured-carousel[data-paused] .carousel-indicators .active .dot-fill {
        animation-play-state: paused; opacity: .55; }
    #featured-carousel[data-paused] .carousel-indicators .active::after { content: ""; position: absolute;
        inset: 2px calc(50% - 3px); background: linear-gradient(90deg,
            #111 0 2px, transparent 2px 4px, #111 4px 6px); }
    @keyframes featured-progress { to { transform: scaleX(1); } }
    #featured-carousel .carousel-indicators [data-bs-target]:focus-visible {
        outline: 2px solid var(--bs-primary); outline-offset: 0; }
    .cta-icon { width: 48px; height: 48px; display: grid; place-items: center;
        background: rgba(207,6,82,.15); color: #ef2f7e; border-radius: 12px; }
    /* Amber accent (website-ng yellow-500) for the "Have an app idea?" card. */
    .cta-icon-amber { background: rgba(255,193,7,.15); color: #ffc107; }
    /* App description heading permalinks: hide the pilcrow, reveal a link icon on hover. */
    .app-description .headerlink {
        visibility: hidden; margin-left: .4rem; font-size: 0; text-decoration: none;
        color: var(--bs-secondary-color); }
    .app-description .headerlink::before {
        font-family: "bootstrap-icons"; content: "\f470"; font-size: 1rem; }
    .app-description .headerlink:hover { color: var(--bs-primary); }
    .app-description :is(h1, h2, h3, h4, h5, h6):hover > .headerlink { visibility: visible; }
    .app-description blockquote {
        border-left: .25rem solid var(--bs-border-color); padding-left: 1rem;
        color: var(--bs-secondary-color); }
    .app-description img { max-width: 100%; height: auto; }
    .app-description pre {
        background: var(--bs-tertiary-bg); padding: 1rem; border-radius: .5rem; overflow-x: auto; }
    .app-description :not(pre) > code {
        background: var(--bs-tertiary-bg); padding: .15em .4em; border-radius: .3rem; }
</style>
