{# Site-specific presentation for the apps catalog (home shelves, /apps grid,
   featured carousel, app detail header). Kept in this repo so the theme package
   only carries styling common to all webosbrew sites. #}
<style>
    /* Google Play–style tiles: shared by home shelves (horizontal) and /apps grid */
    .app-shelf { display: flex; gap: 1rem; overflow-x: auto; padding-top: .75rem;
        scrollbar-width: none; scroll-snap-type: x proximity; }
    .app-shelf::-webkit-scrollbar { display: none; }
    .app-shelf > * { scroll-snap-align: start; }
    /* Rows are spaced by a margin under each tile rather than by row-gap, cancelled under the
       last row: a closed group panel in the grid then takes no space at all, so hiding it moves
       nothing. A gap would cost a row's spacing even at zero height. */
    .app-grid { display: grid; column-gap: 1rem; margin-bottom: -1rem; justify-items: center;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
    .app-grid > :not(.group-panel) { margin-bottom: 1rem; }
    .shelf-card { flex: 0 0 auto; width: 112px; text-align: center; }
    .shelf-thumb { position: relative; width: 96px; height: 96px; margin: 0 auto .5rem; }
    .shelf-icon { width: 96px; height: 96px; object-fit: cover; background: var(--bs-tertiary-bg); }
    /* Smaller tiles in the /apps grid on wide screens, where full-size icons read as crowded. */
    @media (min-width: 992px) {
        #apps-grid .shelf-card { width: 100%; }
        #apps-grid .shelf-thumb, #apps-grid .shelf-icon { width: 80px; height: 80px; } }
    .app-shelf .shelf-thumb > .badge { font-size: .6rem; }
    /* Group tile: the lead's icon on a stack of cards, a "+N" badge for the other members.
       A button that opens the group's panel; reset to look like the link tiles. */
    /* position: relative keeps the tile's visually-hidden text inside the shelf's scroll box;
       otherwise it is placed against .shelf-wrap and widens the page on narrow screens. */
    .group-tile { position: relative; background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
        border-radius: var(--bs-border-radius-xl); scroll-margin-top: 5rem; }
    .group-tile:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 4px; }
    .group-stack { display: block; isolation: isolate; }
    .group-stack::before, .group-stack::after { content: ""; position: absolute; inset: 0;
        border-radius: var(--bs-border-radius-xl); border: 1px solid var(--bs-border-color);
        transition: transform .2s ease; }
    .group-stack::before { z-index: -1; transform: translateY(-11px) scale(.9);
        background: color-mix(in srgb, var(--bs-body-color) 28%, var(--bs-body-bg)); }
    .group-stack::after { z-index: -2; transform: translateY(-20px) scale(.8);
        background: color-mix(in srgb, var(--bs-body-color) 14%, var(--bs-body-bg)); }
    .group-tile:hover .group-stack::before { transform: translateY(-12px) scale(.9); }
    .group-tile:hover .group-stack::after { transform: translateY(-22px) scale(.8); }
    .group-stack .shelf-icon { position: relative; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
    .group-count { position: absolute; z-index: 1; top: -.55rem; right: -.45rem;
        background: var(--bs-secondary-bg); color: var(--bs-emphasis-color);
        border: 2px solid var(--bs-body-bg); font-size: .75rem; }
    .group-tile[aria-expanded="true"] .shelf-icon { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
    /* Group panel: a recessed surface that opens below the group tile's row, the rows after it
       sliding down. The height animates through a one-row grid, 0fr -> 1fr, which every current
       browser transitions; .group-panel-clip is the row, clipping what is not yet revealed.
       In the /apps grid every level down to the members is a column subgrid, so members sit in
       the same columns as the tiles outside. The clip and the surface bleed out by their inline
       padding (negative margin = padding): a subgrid adds its edge margin + padding to its edge
       columns, so this nets to zero there, and the recess extends beyond the columns instead of
       eating into them. On the homepage (no grid) the bleed lines the first member up with the
       shelf's first tile. */
    .group-panel { --notch-x: 50%; --notch-h: 1rem; --panel-pad: .75rem;
        --group-panel-bg: color-mix(in srgb, var(--bs-body-bg) 55%, #000);
        --group-panel-edge: color-mix(in srgb, var(--bs-body-bg) 30%, #000);
        grid-column: 1 / -1; justify-self: stretch; scroll-margin-bottom: 1rem;
        display: grid; grid-template-columns: minmax(0, 1fr); grid-template-columns: subgrid;
        grid-template-rows: 0fr;
        transition: grid-template-rows .38s cubic-bezier(.25, .8, .25, 1); }
    .group-panel[hidden] { display: none; }
    .group-panel.is-open { grid-template-rows: 1fr; }
    .group-panel.no-anim { transition: none; }
    @media (prefers-reduced-motion: reduce) { .group-panel { transition: none; } }
    .group-panel-clip { grid-column: 1 / -1; position: relative; min-height: 0; overflow: hidden;
        display: grid; grid-template-columns: minmax(0, 1fr); grid-template-columns: subgrid; align-content: start;
        margin-inline: calc(-1 * var(--panel-pad)); padding-inline: var(--panel-pad); }
    /* The recess is drawn as a gradient, darkest at the top and bottom edges, not as an inset
       shadow: the notch is filled with the top-edge colour so the two read as one shape. */
    .group-panel-notch { position: absolute; top: 0; left: var(--notch-x); width: 2.5rem;
        height: calc(var(--notch-h) + 1px); transform: translateX(-50%);
        background: var(--group-panel-edge); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    /* Spacing below the panel is inside the part that animates (the clip), so it grows and
       shrinks with the panel. */
    .group-panel-surface { grid-column: 1 / -1;
        display: grid; grid-template-columns: minmax(0, 1fr); grid-template-columns: subgrid;
        margin: var(--notch-h) calc(-1 * var(--panel-pad)) 1rem; padding: 1rem var(--panel-pad) 1.25rem;
        border-radius: var(--bs-border-radius-lg);
        background: linear-gradient(var(--group-panel-edge), var(--group-panel-bg) .9rem,
            var(--group-panel-bg) calc(100% - .9rem), var(--group-panel-edge)); }
    .group-panel-header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1rem; }
    .group-panel .app-grid { grid-column: 1 / -1;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); grid-template-columns: subgrid; }
    /* Homepage: members wrap at the shelf's pitch (tile width and gap), from the shelf's left edge. */
    .shelf-wrap ~ .group-panel .app-grid { display: flex; flex-wrap: wrap; column-gap: 1rem; }
    .shelf-wrap ~ .group-panel .group-panel-surface { margin-bottom: .5rem; }
    .shelf-fade, .shelf-fade-start { position: absolute; top: 0; bottom: .5rem; width: 3rem;
        pointer-events: none; transition: opacity .15s ease; }
    .shelf-fade { right: 0; background: linear-gradient(90deg, transparent, var(--bs-body-bg)); }
    .shelf-fade-start { left: 0; opacity: 0;
        background: linear-gradient(90deg, var(--bs-body-bg), transparent); }
    .hero-banner { background:
        radial-gradient(120% 140% at 85% -20%, rgba(207,6,82,.35), transparent 60%),
        linear-gradient(120deg, #1b1420, #141419); }
    /* Featured banner (after LG's app store): 16:9 slides with a 16px radius, two per view from
       lg up with a 20px gap, one below, in a scroll-snap row. Its height comes from 16:9 alone. */
    .featured { --feat-per: 1; --feat-gap: 20px; --featured-interval: 5s; }
    @media (min-width: 992px) { .featured { --feat-per: 2; } }
    .feat-viewport { position: relative; }
    .feat-track { position: relative; display: flex; gap: var(--feat-gap); overflow-x: auto;
        scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
        border-radius: 16px; }
    .feat-track::-webkit-scrollbar { display: none; }
    .feat-track:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
    .feat-slide { flex: 0 0 calc((100% - (var(--feat-per) - 1) * var(--feat-gap)) / var(--feat-per));
        aspect-ratio: 16 / 9; scroll-snap-align: start; scroll-snap-stop: always;
        position: relative; overflow: hidden; border-radius: 16px; container-type: inline-size; }
    .featured[data-count="1"] .feat-track { justify-content: center; overflow: hidden; }
    /* One fixed template per slide, sized in container units so it scales with the slide: a
       large icon and a fixed-height text group (label, one-line title, two-line description area)
       side by side, centred vertically. Both have fixed heights, so the centring puts them at the
       same place on every slide whatever the text. The whole slide is the link (its title link,
       stretched): focus ring inside the edge, a slight brightening on hover. */
    .feat-body { position: absolute; inset: 0; display: grid; align-items: center; padding: 0 6.5cqi;
        grid-template-columns: 20cqi minmax(0, 1fr); column-gap: 4.5cqi; }
    .feat-body > img { width: 20cqi; height: 20cqi; border-radius: 3.8cqi; }
    .feat-text { min-width: 0; }
    .feat-label { font-size: max(10px, 2.4cqi); line-height: 1.4; font-weight: 600; letter-spacing: .1em;
        text-transform: uppercase; color: var(--bs-primary); margin-bottom: 1cqi; }
    .feat-title { font-size: 5.2cqi; line-height: 1.25; font-weight: 500; margin: 0 0 1.2cqi;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feat-link { color: #fff; text-decoration: none; }
    .feat-link:focus-visible { outline: none; }
    .feat-desc { font-size: 3.2cqi; line-height: 1.4; height: 2.8em; margin: 0; color: rgba(255, 255, 255, .75);
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
    .feat-slide { transition: filter .2s ease; }
    .feat-slide:has(.feat-link:focus-visible) { outline: 3px solid var(--bs-primary); outline-offset: -3px; }
    @media (hover: hover) { .feat-slide:has(.feat-link:hover) { filter: brightness(1.15); } }
    /* Arrows on the track's edges, on wide screens with a mouse (swipe elsewhere); hidden when
       every slide fits in view. */
    .feat-arrow { display: none; position: absolute; z-index: 1; top: 50%; width: 2.5rem; height: 2.5rem;
        place-items: center; padding: 0; border: 1px solid rgba(255, 255, 255, .25); border-radius: 50%;
        background: rgba(20, 20, 25, .85); color: #fff; font-size: 1.1rem; }
    .feat-prev { left: 0; transform: translate(-50%, -50%); }
    .feat-next { right: 0; transform: translate(50%, -50%); }
    .feat-arrow:hover { background: rgba(40, 40, 48, .95); }
    .feat-arrow:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
    @media (min-width: 992px) and (hover: hover) and (pointer: fine) {
        .featured:not([data-count="1"]):not([data-count="2"]) .feat-arrow { display: grid; }
    }
    /* Dots below the track, in a row of fixed height. Each is a 24px target (transparent border,
       fill clipped to the 10px dot). The current slide's dot is a pill whose fill grows over the
       interval; the script moves on when that animation ends, so the fill is the timer. Paused
       (data-paused), the fill stops and dims and a pause glyph shows on the pill. */
    .feat-dots { display: flex; justify-content: center; align-items: center; min-height: 2rem; margin-top: .5rem; }
    @media (min-width: 992px) { .featured[data-count="2"] .feat-dots { display: none; } }
    .feat-dots > button { position: relative; box-sizing: content-box; width: 10px; height: 10px;
        margin: 0; padding: 0; border: 7px solid transparent; border-radius: 12px; background-clip: padding-box;
        background-color: rgba(255, 255, 255, .4); overflow: hidden; cursor: pointer; transition: width .25s ease; }
    .feat-dots > .active { width: 32px; background-color: rgba(255, 255, 255, .3); }
    .feat-dots .dot-fill { position: absolute; inset: 0; background: #fff; transform: scaleX(0); transform-origin: left; }
    .feat-dots > .active .dot-fill { animation: featured-progress var(--featured-interval) linear forwards; }
    .featured[data-paused] .feat-dots > .active .dot-fill { animation-play-state: paused; opacity: .55; }
    .featured[data-paused] .feat-dots > .active::after { content: ""; position: absolute;
        inset: 2px calc(50% - 3px); background: linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 6px); }
    @keyframes featured-progress { to { transform: scaleX(1); } }
    .feat-dots > button:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 0; }
    .cta-icon { width: 48px; height: 48px; display: grid; place-items: center;
        background: rgba(207,6,82,.15); color: #ef2f7e; border-radius: 12px; }
    /* Amber accent (website-ng yellow-500) for the "Have an app idea?" card. */
    .cta-icon-amber { background: rgba(255,193,7,.15); color: #ffc107; }
    /* App description heading permalinks: hide the pilcrow, reveal a link icon on hover. */
    .app-description .headerlink {
        visibility: hidden; margin-left: .4rem; font-size: 0; text-decoration: none;
        color: var(--bs-secondary-color); }
    .app-description .headerlink::before {
        font-family: "bootstrap-icons"; content: "\f470"; font-size: 1rem; }
    .app-description .headerlink:hover { color: var(--bs-primary); }
    .app-description :is(h1, h2, h3, h4, h5, h6):hover > .headerlink { visibility: visible; }
    .app-description blockquote {
        border-left: .25rem solid var(--bs-border-color); padding-left: 1rem;
        color: var(--bs-secondary-color); }
    .app-description img { max-width: 100%; height: auto; }
    .app-description pre {
        background: var(--bs-tertiary-bg); padding: 1rem; border-radius: .5rem; overflow-x: auto; }
    .app-description :not(pre) > code {
        background: var(--bs-tertiary-bg); padding: .15em .4em; border-radius: .3rem; }
    /* All apps filter bar below lg: sits under the sticky navbar; the chip row scrolls without a scrollbar. */
    .filter-bar { top: var(--navbar-height); z-index: 1010; }  /* top is set from the navbar height by the script */
    .chip-row { scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 0 .25rem; }
    .chip-row::-webkit-scrollbar { display: none; }
</style>
